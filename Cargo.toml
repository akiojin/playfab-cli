[package]
name = "playfab-cli"
version = "0.1.0"
edition = "2021"
description = "Rust CLI for PlayFab service automation with 200+ tool definitions"
readme = "README.md"
license = "MIT"
repository = "https://github.com/akiojin/playfab-cli"
homepage = "https://github.com/akiojin/playfab-cli"
documentation = "https://github.com/akiojin/playfab-cli#readme"
keywords = ["playfab", "cli", "automation", "gamedev"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "playfab-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.11"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "bin"
