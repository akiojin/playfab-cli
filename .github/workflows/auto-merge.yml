name: Auto Merge PR

# Security notes:
# - Auto-merge is enabled ONLY for same-repository PRs authored by the
#   maintainer (akiojin). PRs from forks, external contributors, or bots
#   (Dependabot, etc.) are never auto-merged and require manual review.
# - This workflow runs on `pull_request_target` with a PAT. It MUST NOT check
#   out or execute the PR head code. It only calls `gh pr merge --auto` against
#   the PR number; the required status checks on the base branch still gate
#   the actual merge.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'akiojin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'develop') ||
        (github.event.pull_request.base.ref == 'develop' &&
         github.event.pull_request.head.ref != 'main')
      )
    steps:
      - name: Enable auto-merge (with retry)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "PERSONAL_ACCESS_TOKEN not provided, skipping auto-merge"
            exit 0
          fi
          for i in $(seq 1 60); do
            echo "Attempt $i: enable auto-merge for #$PR_NUMBER"
            if gh pr merge "$PR_NUMBER" --auto --merge --repo "$REPO"; then
              echo "Auto-merge enabled"
              exit 0
            fi
            mergeable=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable --jq .mergeable || echo "UNKNOWN")
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "PR has merge conflicts; cannot auto-merge" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Failed to enable auto-merge after 10 minutes" >&2
          exit 1
